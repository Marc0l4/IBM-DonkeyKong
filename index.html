<!DOCTYPE html>
<!--
  =============================================================
  DONKEY KONG CLONE — Workshop Demo
  =============================================================
  CONTROLES:
    Setas Esquerda / Direita  ou  A / D  → mover o Mario
    Espaço                               → pular (quando no chão)
    Seta para Cima  / W                  → subir escadas
    Seta para Baixo / S                  → descer escadas
    Enter                                → confirmar nas telas de menu

  PARA JOGAR:
    Dê duplo clique em index.html — sem instalar nada.
    Funciona também em deploy estático (Vercel, GitHub Pages, etc.)

  ESTRUTURA:
    css/style.css      → estilos do canvas
    js/constants.js    → constantes e PLATFORM_GAP
    js/levels.js       → dados das 3 fases
    js/input.js        → teclado
    js/physics.js      → física e colisões
    js/entities.js     → Player, Barrel, DK, Pauline, Hammer, OilBarrel, Fireball
    js/systems.js      → BarrelSpawner, FireballSystem, ScoreSystem
    js/renderer.js     → desenho e HUD
    js/game.js         → estados e update
    js/main.js         → loop e inicialização
  =============================================================
-->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Donkey Kong</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <!--
    Scripts carregados em ordem de dependência.
    Sem type="module" — funciona com duplo clique no arquivo.
    Todos usam o namespace DK (window.DK) para evitar poluição global.
  -->
  <script src="js/constants.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/input.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/physics.js"></script>
  <script src="js/entities.js"></script>
  <script src="js/systems.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
